<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="archfleet">
  <style>
    .n { font: 800 19px 'JetBrains Mono','JetBrainsMono Nerd Font','SF Mono',ui-monospace,Menlo,Consolas,monospace; fill: #ff8c1a; }
    .d { font: 13px 'JetBrains Mono','JetBrainsMono Nerd Font','SF Mono',ui-monospace,Menlo,Consolas,monospace; fill: #d8cbbf; }
    .l { font: 12px 'JetBrains Mono','JetBrainsMono Nerd Font','SF Mono',ui-monospace,Menlo,Consolas,monospace; fill: #7a675a; }
    .t { font: 11px 'JetBrains Mono','JetBrainsMono Nerd Font','SF Mono',ui-monospace,Menlo,Consolas,monospace; fill: #7a675a; }
  </style>
  <rect x=".5" y=".5" width="439" height="149" rx="10" fill="#1a130f" stroke="#3a2c22"/>
  <rect x="0" y="12" width="3" height="126" rx="1.5" fill="#ff8c1a"/>
  <text x="24" y="38" class="n">archfleet</text>
  <text x="416" y="38" class="l" text-anchor="end">→</text>
  <text x="24" y="70" class="d">one rust binary watching every machine at home</text><text x="24" y="89" class="d">over plain ssh: status, wake-on-lan, processes,</text><text x="24" y="108" class="d">hyprland, files, shared clipboards.</text>
  <circle cx="30" cy="131" r="5" fill="#dea584"/>
  <text x="42" y="135" class="l">Rust</text>
  <rect x="89" y="122" width="66" height="18" rx="9" fill="none" stroke="#3a2c22"/><text x="122" y="135" class="t" text-anchor="middle">ratatui</text><rect x="162" y="122" width="38" height="18" rx="9" fill="none" stroke="#3a2c22"/><text x="180" y="135" class="t" text-anchor="middle">ssh</text><rect x="205" y="122" width="38" height="18" rx="9" fill="none" stroke="#3a2c22"/><text x="224" y="135" class="t" text-anchor="middle">tui</text>
</svg>
